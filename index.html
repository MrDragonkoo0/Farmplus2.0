<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Farm+</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <div><b>🌾 Farm+</b><span id="season">...</span></div>
    <div class="coins">🪙 <span id="coins">0</span></div>
  </header>
  <main>
    <section class="hero card">
      <div><div class="muted">Фермер</div><h1 id="name">Завантаження...</h1><div id="level"></div></div>
      <div class="balance">💰 <b id="balance">0</b> ₴</div>
    </section>
    <section class="weather card"><span id="weather">🌤️</span><div><b id="weatherName">...</b><div id="temp" class="muted"></div></div></section>
    <nav class="grid">
      <button data-page="fields">🌾<span>Поля</span></button>
      <button data-page="warehouse">📦<span>Склад</span></button>
      <button data-page="garage">🚜<span>Гараж</span></button>
      <button data-page="livestock">🐄<span>Тварини</span></button>
      <button data-page="workers">👷<span>Працівники</span></button>
      <button data-page="orders">📋<span>Замовлення</span></button>
    </nav>
    <section id="content" class="card content"><div class="muted">Вибери розділ.</div></section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
